spring.application.name=gamblr-writer
server.port=${GAMBLR_WRITER_PORT:8080}
server.address=${GAMBLR_BIND_ADDRESS:127.0.0.1}
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=verify-full&currentSchema=gamblr&connectTimeout=10
spring.datasource.username=${GAMBLR_WRITE_DB_USER}
spring.datasource.password=${GAMBLR_WRITE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.data-source-properties.sslrootcert=${SUPABASE_DB_SSLROOTCERT}
spring.datasource.hikari.data-source-properties.ApplicationName=gamblr-writer
spring.sql.init.mode=never
server.error.include-message=never
server.error.include-stacktrace=never
gamblr.auth.issuer=${GAMBLR_AUTH_ISSUER:}
gamblr.supabase-url=${SUPABASE_URL:}
gamblr.auth.jwk-set-uri=${GAMBLR_AUTH_JWKS_URI:}
gamblr.auth.audience=authenticated
